<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="reset-token" content="__RESET_TOKEN__">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Reset 雷达：在 Magpie 关注 GPT、Claude、Kimi、Grok、DeepSeek 的公开额度与用量变化。">
  <title>Reset 雷达</title>
  <link rel="icon" href="./icon.svg">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./view.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body data-view="dashboard">
  <main class="app">
    <header class="topbar">
      <a class="brand" href="https://resetbell.dev/zh" target="_blank" rel="noopener noreferrer"><img src="./icon.svg" width="32" height="32" alt=""><span>Reset</span><span class="brand-caption" data-i18n="brandCaption">额度雷达</span></a>
      <div class="top-actions">
        <span class="local-label" role="status"><span class="local-dot"></span><span id="local-status">等待选择</span></span>
        <span class="top-divider" aria-hidden="true"></span>
        <button id="language" class="quiet language-button" aria-label="Switch language">EN</button>
      </div>
    </header>

    <section id="dashboard-view" class="dashboard-view">
      <div class="dashboard">
        <aside class="monitor-column" aria-label="监控面板">
          <section id="workspace" class="panel current-panel" aria-busy="false">
            <div class="current-provider">
              <div class="provider-emblem"><img id="current-icon" src="./icon.svg" alt=""><span id="current-mark" class="current-mark" aria-hidden="true"></span></div>
              <div class="current-copy"><h2 id="monitor-name">选择监控对象</h2></div>
              <div class="current-actions">
                <button id="manage" class="row-action" type="button"><span data-i18n="change">更换</span><span aria-hidden="true">›</span></button>
                <button id="refresh" class="row-action refresh-action" type="button" disabled aria-live="polite">
                  <span class="refresh-glyph" aria-hidden="true">
                    <svg class="refresh-arrows" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"></path><path d="M4 3v5h5"></path><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"></path><path d="M20 21v-5h-5"></path></svg>
                    <svg class="refresh-check" viewBox="0 0 24 24"><path d="m5 12 4.2 4.2L19 6.5"></path></svg>
                    <svg class="refresh-alert" viewBox="0 0 24 24"><path d="M12 6.5v7"></path><path d="M12 18h.01"></path></svg>
                  </span>
                  <span id="refresh-label" data-i18n="refresh">刷新</span>
                </button>
              </div>
            </div>
            <div class="current-details">
              <a id="reset-link" class="reset-card" href="https://resetbell.dev/zh/updates" target="_blank" rel="noopener noreferrer">
                <span class="reset-card-head"><span data-i18n="resetAgeLabel">上次公开重置</span><span class="reset-arrow" aria-hidden="true">↗</span></span>
                <strong id="latest-reset-age" class="reset-age" data-relative="">—</strong>
                <time id="latest-reset" class="reset-date">—</time>
                <span class="reset-summary"><span><span data-i18n="resetRecent">近 30 天</span> <b id="reset-count">—</b> <span data-i18n="resetTimes">天有重置</span></span></span>
                <span id="reset-timeline" class="reset-timeline" role="img" aria-label="近 30 天公开重置记录"></span>
                <span class="timeline-endpoints" aria-hidden="true"><span id="timeline-start"></span><span id="timeline-end"></span></span>
              </a>
              <section class="recent-section" aria-labelledby="recent-title">
                <header class="recent-heading"><h3 id="recent-title" data-i18n="recentResets">已确认的公开重置</h3><a id="reset-history" href="https://resetbell.dev/zh/updates" target="_blank" rel="noopener noreferrer" data-i18n="viewAll">查看全部</a></header>
                <div id="recent-resets" class="reset-records"></div>
              </section>
            </div>
          </section>
        </aside>

        <section class="activity panel" aria-label="额度变化">
          <header class="activity-head"><h2 data-i18n="feedTitle">额度变化</h2><a id="all-updates" href="https://resetbell.dev/zh/updates" target="_blank" rel="noopener noreferrer"><span data-i18n="viewAll">查看全部</span><span aria-hidden="true">›</span></a></header>
          <div class="feed-tools">
            <div id="filters" class="filters" role="group" aria-label="变化类型"><button type="button" data-kind="all" aria-pressed="true" data-i18n="filterAll">全部</button><button type="button" data-kind="reset" aria-pressed="false" data-i18n="filterReset">额度重置</button><button type="button" data-kind="credits" aria-pressed="false" data-i18n="filterCredits">额度权益</button><button type="button" data-kind="rules" aria-pressed="false" data-i18n="filterRules">规则变化</button></div>
          </div>
          <div id="notice" class="notice" role="status" hidden></div>
          <div id="feed" class="feed-scroll" aria-live="polite" aria-busy="false"><div class="empty"><p data-i18n="loading">正在读取你的雷达…</p></div></div>
        </section>
      </div>
    </section>

    <section id="manage-view" class="manage-view" hidden aria-labelledby="manage-title">
      <div class="manage-shell panel">
        <button id="manage-back" class="back-button" type="button"><span aria-hidden="true">←</span><span data-i18n="back">返回</span></button>
        <header class="manage-heading">
          <h1 id="manage-title" data-i18n="manageTitle">选择厂商</h1>
          <p data-i18n="manageIntro">一次选择一家，随时切换。</p>
        </header>
        <p id="manage-error" class="manage-error" role="alert" hidden></p>
        <div id="manage-providers" class="manage-providers"></div>
        <p class="manage-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.7 3 7.7 7.5 9.5 4.5-1.8 7.5-4.8 7.5-9.5V6L12 3Z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg><span data-i18n="manageNote">无需登录，不读取你的个人账户或额度。</span></p>
      </div>
    </section>

    <footer class="app-footer"><span data-i18n="disclaimer">公开公告 ≠ 个人额度到账。预告与第三方观测不计为官方完成。</span><span data-i18n="polling">自动更新 · 断网保留缓存</span></footer>
  </main>
  <div id="feedback" class="feedback" role="status" hidden></div>
</body>
</html>
