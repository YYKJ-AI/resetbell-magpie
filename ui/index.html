<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="reset-token" content="__RESET_TOKEN__">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Reset 雷达：在 Magpie 关注 GPT、Claude、Kimi、Grok 的公开额度重置与官方动态。">
  <title>Reset 雷达</title>
  <link rel="icon" href="./icon.svg">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./style.css">
  <script src="./view.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body data-view="dashboard">
  <main class="app">
    <header class="topbar">
      <a class="brand" href="https://resetbell.dev/zh" target="_blank" rel="noopener noreferrer"><img src="./icon.svg" width="32" height="32" alt=""><span>Reset</span><span class="brand-caption" data-i18n="brandCaption">额度雷达</span></a>
      <div class="top-actions">
        <span class="local-label" role="status"><span class="local-dot"></span><span id="local-status">等待选择</span></span>
        <span class="top-divider" aria-hidden="true"></span>
        <button id="language" class="quiet language-button" aria-label="Switch language">EN</button>
      </div>
    </header>

    <section id="dashboard-view" class="dashboard-view">
      <div class="dashboard">
        <aside class="monitor-column" aria-label="监控面板">
          <section class="panel services-panel">
            <div class="panel-heading">
              <h1 data-i18n="servicesTitle">关注的服务</h1>
              <button id="manage" class="manage-button" type="button"><span data-i18n="manage">管理</span><span aria-hidden="true">›</span></button>
            </div>
            <fieldset class="providers">
              <legend class="sr-only" data-i18n="choose">选择一家监控厂商</legend>
              <div id="providers" class="provider-grid"></div>
            </fieldset>
          </section>

          <section id="workspace" class="panel current-panel" aria-busy="false">
            <div class="current-heading"><span data-i18n="currentProvider">当前关注</span></div>
            <div class="current-provider">
              <div class="provider-emblem"><img id="current-icon" src="./icon.svg" alt=""><span id="current-mark" class="current-mark" aria-hidden="true"></span></div>
              <div class="current-copy"><h2 id="monitor-name">选择监控对象</h2><p id="current-vendor">—</p></div>
              <div class="radar" aria-hidden="true"><span class="radar-wave"></span><span class="radar-point"></span></div>
            </div>
            <div class="current-details">
              <a id="reset-link" class="reset-card" href="https://resetbell.dev/zh/updates" target="_blank" rel="noopener noreferrer">
                <span class="reset-card-head">
                  <span data-i18n="resetAgeLabel">距上次公开重置</span>
                  <span id="latest-kind" class="badge type-badge">—</span>
                </span>
                <strong id="latest-reset-age" class="reset-age" data-relative="">—</strong>
                <time id="latest-reset" class="reset-date">—</time>
                <span class="reset-summary">
                  <span><span data-i18n="resetRecent">近 30 天</span> <b id="reset-count">—</b> <span data-i18n="resetTimes">次公开重置</span></span>
                  <span data-i18n="resetRecords">公开记录</span>
                </span>
                <span id="reset-timeline" class="reset-timeline" role="img" aria-label="近 30 天公开重置记录"></span>
                <span class="reset-range"><time id="reset-range-start">—</time><time id="reset-range-end">—</time></span>
                <span class="reset-card-foot"><span data-i18n="latestUpdates">最新动态</span><span aria-hidden="true">↗</span></span>
              </a>
              <div class="info-row">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.7 3 7.7 7.5 9.5 4.5-1.8 7.5-4.8 7.5-9.5V6L12 3Z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg>
                <span class="info-copy"><span data-i18n="sourceHealth">信息来源</span><strong id="source-health">—</strong><small id="source-note" data-i18n="sourcePending">选择厂商后显示来源状态</small></span>
              </div>
              <div class="info-row">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>
                <span class="info-copy"><span data-i18n="lastSync">最近更新</span><time id="last-sync">—</time></span>
                <button id="refresh" class="row-action" type="button" disabled data-i18n="refresh">刷新</button>
              </div>
            </div>
          </section>

          <section class="panel notification-card">
            <span class="notification-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7-2.5 8.5h17C20.5 16 18 16 18 9Z"></path><path d="M9.5 21h5"></path></svg></span>
            <span class="notification-copy"><strong data-i18n="notifications">系统提醒</strong><small data-i18n="notificationHelp">有新的公开动态时通知我</small></span>
            <input id="notifications" type="checkbox" role="switch" disabled>
            <button id="test-notification" class="text-button" hidden data-i18n="testNotification">发送一条测试通知</button>
          </section>
        </aside>

        <section class="activity panel" aria-label="公开动态">
          <header class="activity-head"><h2 data-i18n="feedTitle">公开动态</h2><a id="all-updates" href="https://resetbell.dev/zh/updates" target="_blank" rel="noopener noreferrer"><span data-i18n="viewAll">查看全部</span><span aria-hidden="true">›</span></a></header>
          <div class="feed-tools">
            <div id="filters" class="filters" role="group" aria-label="动态分类"><button type="button" data-kind="all" aria-pressed="true" data-i18n="filterAll">全部</button><button type="button" data-kind="reset" aria-pressed="false" data-i18n="filterReset">额度重置</button><button type="button" data-kind="credits" aria-pressed="false" data-i18n="filterCredits">发卡</button><button type="button" data-kind="rules" aria-pressed="false" data-i18n="filterRules">规则变化</button></div>
            <div class="search-field"><label for="search" class="sr-only" data-i18n="searchLabel">搜索公开动态</label><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 5 5"></path></svg><input id="search" type="search" maxlength="200" autocomplete="off" placeholder="搜索动态…"><kbd id="search-shortcut" aria-hidden="true">/</kbd><button id="clear-search" class="clear-search" type="button" aria-label="清除搜索" hidden><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 4 8 8M4 12l8-8"></path></svg></button></div>
          </div>
          <div id="notice" class="notice" role="status" hidden></div>
          <p id="search-result" class="search-result" role="status" hidden></p>
          <div id="feed" class="feed-scroll" aria-live="polite" aria-busy="false"><div class="empty"><p data-i18n="loading">正在读取你的雷达…</p></div></div>
        </section>
      </div>
    </section>

    <section id="manage-view" class="manage-view" hidden aria-labelledby="manage-title">
      <div class="manage-shell panel">
        <button id="manage-back" class="back-button" type="button"><span aria-hidden="true">←</span><span data-i18n="back">返回</span></button>
        <header class="manage-heading">
          <p class="eyebrow" data-i18n="manageEyebrow">SERVICE MANAGEMENT</p>
          <h1 id="manage-title" data-i18n="manageTitle">管理关注的服务</h1>
          <p data-i18n="manageIntro">一次关注一家 AI 服务。切换后，公开动态、重置记录和来源状态会同步更新。</p>
        </header>
        <div id="manage-current" class="manage-current" role="status"></div>
        <div id="manage-providers" class="manage-providers"></div>
        <p class="manage-note"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.7 3 7.7 7.5 9.5 4.5-1.8 7.5-4.8 7.5-9.5V6L12 3Z"></path><path d="m8.5 12 2.2 2.2 4.8-5"></path></svg><span data-i18n="manageNote">无需登录，不读取你的个人账户或额度。</span></p>
      </div>
    </section>

    <footer class="app-footer"><span data-i18n="disclaimer">公开公告 ≠ 个人额度到账。预告与第三方观测不计为官方完成。</span><span data-i18n="polling">自动更新 · 断网保留缓存</span></footer>
  </main>
  <div id="feedback" class="feedback" role="status" hidden></div>
</body>
</html>
